name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and publish application
        shell: pwsh
        run: |
          dotnet restore AdminPanel/AdminPanel.csproj
          dotnet publish AdminPanel/AdminPanel.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup Compiler was not found."
          }
          & $iscc "Installer/AdminPanel.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdminPanel-Setup
          path: dist/AdminPanel-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" "dist/AdminPanel-Setup.exe" `
            --title "Admin Panel $env:GITHUB_REF_NAME" `
            --generate-notes
