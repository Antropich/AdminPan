name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Stamp version into the app and the installer
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart("v")
          foreach ($f in "admin_panel.py", "installer.py") {
            (Get-Content $f -Raw -Encoding UTF8) -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$v`"" | Set-Content $f -Encoding UTF8
          }

      - name: Build AdminPanel.exe
        run: pyinstaller --noconsole --onefile --uac-admin --icon assets/icon.ico --name AdminPanel admin_panel.py

      - name: Build installer
        run: pyinstaller --noconsole --onefile --uac-admin --icon assets/icon.ico --name AdminPanel-Setup --add-data "dist/AdminPanel.exe;payload" --add-data "assets/icon.ico;payload" --distpath installer_output --workpath build_setup installer.py

      - uses: actions/upload-artifact@v4
        with:
          name: AdminPanel-Setup
          path: installer_output/AdminPanel-Setup.exe

      - name: Publish GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: installer_output/AdminPanel-Setup.exe
