name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build AdminPanel.exe
        run: pyinstaller --noconsole --onefile --uac-admin --name AdminPanel admin_panel.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name }}".TrimStart("v")
          if ($v -notmatch '^\d') { $v = "0.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: AdminPanel-Setup
          path: installer_output/AdminPanel-Setup.exe

      - name: Publish GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: installer_output/AdminPanel-Setup.exe
